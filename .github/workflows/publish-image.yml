name: Publish Samsa image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/fabriciooml/samsa:latest
            ghcr.io/fabriciooml/samsa:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Fabriciooml/samsa
